<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1c1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Side B">
  <title>Side B</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="station">
      <h1 class="title">Side B</h1>
      <span class="dial" aria-hidden="true"><span class="fm">FM</span> 98.7</span>
      <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
  </header>

  <main class="deck">
    <section class="cassette" id="cassette" aria-label="Puzzle">
      <span class="screw s1"></span><span class="screw s2"></span><span class="screw s3"></span><span class="screw s4"></span>
      <div class="label-strip" aria-hidden="true">
        <span class="label-side">B</span>
        <span class="label-lines"></span>
        <span class="label-level" id="label-level">Easy</span>
      </div>
      <div class="window">
        <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      </div>
    </section>

    <aside class="desk">
      <div class="howto" id="howto" hidden>
        <h2>How to play</h2>
        <ul>
          <li>Each row holds 1 to 9 once.</li>
          <li>Each column holds 1 to 9 once.</li>
          <li>Each 3×3 box holds 1 to 9 once.</li>
        </ul>
        <p><strong>Notes</strong> are small pencil marks for digits you're considering. Turn Notes on, then tap digits to jot them in a square.</p>
        <button class="btn quiet" id="howto-close" type="button">Got it</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="pad" id="pad" aria-label="Digits"></div>

      <div class="tools">
        <button class="btn tool" id="notes" type="button" aria-pressed="false">Notes <span class="state" id="notes-state">off</span></button>
        <button class="btn tool" id="erase" type="button">Erase</button>
        <button class="btn tool" id="hint" type="button">Hint</button>
        <button class="btn tool" id="undo" type="button">Undo</button>
        <button class="btn tool" id="redo" type="button">Redo</button>
        <button class="btn tool" id="help" type="button">How to play</button>
      </div>

      <div class="newgame">
        <span class="newgame-label">New puzzle</span>
        <div class="levels">
          <button class="btn level" type="button" data-level="easy">Easy</button>
          <button class="btn level" type="button" data-level="medium">Medium</button>
          <button class="btn level" type="button" data-level="hard">Hard</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>

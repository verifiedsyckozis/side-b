<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241e3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Side B">
  <title>Side B</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="unicorn" viewBox="0 0 200 200">
        <path fill="url(#mane)" d="M110 40 C138 16 180 30 184 66 C170 54 152 56 142 64 C138 54 126 46 110 40 Z M146 68 C174 64 196 92 188 126 C178 106 164 100 154 104 C154 92 152 80 146 68 Z M156 108 C182 112 198 146 186 174 C178 154 168 148 162 150 C162 136 160 122 156 108 Z M163 152 C186 160 194 186 186 200 H172 C172 184 168 168 163 152 Z"/>
        <path fill="var(--uni-coat, #f7f1fb)" d="M92 58 C80 70 60 92 44 112 C36 122 30 128 32 136 C34 144 44 146 52 142 C60 138 66 134 74 136 C86 140 96 150 104 164 L118 200 H176 C168 160 160 120 150 88 C142 66 128 50 116 44 L113 20 L101 46 C98 51 95 55 92 58 Z"/>
        <path fill="url(#horn)" d="M88 57 L60 4 L101 49 Z"/>
        <path d="M74 31 L86 37 M80 41 L91 45 M68 21 L79 28" fill="none" stroke="var(--uni-line, #3a2f55)" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
        <path fill="url(#mane)" d="M103 45 C90 38 76 44 72 56 C82 51 92 53 97 60 Z"/>
        <path d="M70 84 C75 89 82 89 87 84" fill="none" stroke="var(--uni-line, #3a2f55)" stroke-width="3" stroke-linecap="round"/>
        <path d="M73 88 L71 92 M78 89.5 L78 94 M83 88 L85 92" fill="none" stroke="var(--uni-line, #3a2f55)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="40" cy="132" r="2.5" fill="var(--uni-line, #3a2f55)" fill-opacity="0.5"/>
      </symbol>
      <linearGradient id="mane" x1="0" y1="0" x2="0.6" y2="1">
        <stop offset="0" stop-color="#f6a8cf"/><stop offset="0.35" stop-color="#c7a6f2"/><stop offset="0.7" stop-color="#9fd3f0"/><stop offset="1" stop-color="#a8e8cf"/>
      </linearGradient>
      <linearGradient id="horn" x1="1" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#f7d48a"/><stop offset="1" stop-color="#fff3d6"/>
      </linearGradient>
      <symbol id="sparkle" viewBox="0 0 20 20"><path d="M10 0 C11 7 13 9 20 10 C13 11 11 13 10 20 C9 13 7 11 0 10 C7 9 9 7 10 0 Z"/></symbol>
    </defs>
  </svg>

  <svg class="sky" aria-hidden="true" focusable="false">
    <use href="#sparkle" x="6%" y="14%" width="14" height="14"/>
    <use href="#sparkle" x="44%" y="4%" width="10" height="10"/>
    <use href="#sparkle" x="58%" y="10%" width="16" height="16"/>
    <use href="#sparkle" x="90%" y="22%" width="12" height="12"/>
    <use href="#sparkle" x="3%" y="62%" width="10" height="10"/>
    <use href="#sparkle" x="70%" y="58%" width="12" height="12"/>
    <use href="#sparkle" x="30%" y="94%" width="14" height="14"/>
    <use href="#sparkle" x="96%" y="48%" width="9" height="9"/>
    <circle cx="20%" cy="6%" r="1.5"/><circle cx="76%" cy="5%" r="1.2"/><circle cx="84%" cy="38%" r="1.4"/>
    <circle cx="12%" cy="84%" r="1.3"/><circle cx="52%" cy="96%" r="1.2"/><circle cx="64%" cy="30%" r="1"/>
  </svg>
  <svg class="big-unicorn" aria-hidden="true" focusable="false"><use href="#unicorn"/></svg>

  <header class="top">
    <div class="station">
      <svg class="title-unicorn" aria-hidden="true" focusable="false"><use href="#unicorn"/></svg>
      <h1 class="title">Side B</h1>
    </div>
  </header>

  <main class="deck">
    <section class="cassette" id="cassette" aria-label="Puzzle">
      <div class="label-strip" aria-hidden="true">
        <svg class="label-side" aria-hidden="true" focusable="false"><use href="#unicorn"/></svg>
        <span class="label-lines"></span>
        <span class="label-level" id="label-level">Easy</span>
      </div>
      <div class="window">
        <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      </div>
    </section>

    <aside class="desk">
      <div class="howto" id="howto" hidden>
        <h2>How to play</h2>
        <ul>
          <li>Each row holds 1 to 9 once.</li>
          <li>Each column holds 1 to 9 once.</li>
          <li>Each 3×3 box holds 1 to 9 once.</li>
        </ul>
        <p><strong>Notes</strong> are small pencil marks for digits you're considering. Turn Notes on, then tap digits to jot them in a square.</p>
        <button class="btn quiet" id="howto-close" type="button">Got it</button>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="pad" id="pad" aria-label="Digits"></div>

      <div class="tools">
        <button class="btn tool" id="notes" type="button" aria-pressed="false">Notes <span class="state" id="notes-state">off</span></button>
        <button class="btn tool" id="erase" type="button">Erase</button>
        <button class="btn tool" id="hint" type="button">Hint</button>
        <button class="btn tool" id="undo" type="button">Undo</button>
        <button class="btn tool" id="redo" type="button">Redo</button>
        <button class="btn tool" id="help" type="button">How to play</button>
      </div>

      <div class="newgame">
        <span class="newgame-label">New puzzle</span>
        <div class="levels">
          <button class="btn level" type="button" data-level="easy">Easy</button>
          <button class="btn level" type="button" data-level="medium">Medium</button>
          <button class="btn level" type="button" data-level="hard">Hard</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
